<main class="public-events">
  <header class="public-events__header">
    <p>MALIKK EVENTOS</p>
    <h1>Eventos disponibles</h1>
    <span>Consulta los eventos y reserva desde tu cuenta de cliente.</span>
    <a routerLink="/login">Iniciar sesión para reservar</a>
  </header>
  <section class="public-events__grid" aria-label="Eventos disponibles">
    @for (evento of eventos(); track evento.ID_evento) {
      <app-evento-card [evento]="evento" />
    } @empty {
      @if (!mensaje) { <p role="status">No hay eventos publicados.</p> }
    }
  </section>
  @if (mensaje) { <p role="alert">{{ mensaje }}</p> }
</main>
